<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="360">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="18">GDSS I/O Pipeline: from Git to terminal</text>

  <!-- Git source -->
  <rect x="40" y="140" width="150" height="80" rx="14" fill="#06b6d4" stroke="#035e66" stroke-width="2" />
  <text x="115" y="172" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">Git repo</text>
  <text x="115" y="192" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">commits, files, tree</text>

  <!-- GitObserver -->
  <rect x="230" y="140" width="150" height="80" rx="14" fill="#0ea5e9" stroke="#075985" stroke-width="2" />
  <text x="305" y="172" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">GitObserver</text>
  <text x="305" y="192" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">content, diffs</text>

  <!-- ASTParser -->
  <rect x="420" y="140" width="150" height="80" rx="14" fill="#2563eb" stroke="#1e40af" stroke-width="2" />
  <text x="495" y="172" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">ASTParser</text>
  <text x="495" y="192" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">List[CodeSymbol]</text>

  <!-- TransformExtractor -->
  <rect x="610" y="60" width="160" height="80" rx="14" fill="#7c3aed" stroke="#4c1d95" stroke-width="2" />
  <text x="690" y="92" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">TransformExtractor</text>
  <text x="690" y="112" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">List[SemanticOperator]</text>

  <!-- CodeGraph -->
  <rect x="610" y="220" width="160" height="80" rx="14" fill="#f59e0b" stroke="#92400e" stroke-width="2" />
  <text x="690" y="252" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">CodeGraph</text>
  <text x="690" y="272" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">NetworkX DiGraph</text>

  <!-- CLI / Rich -->
  <rect x="820" y="60" width="150" height="80" rx="14" fill="#10b981" stroke="#065f46" stroke-width="2" />
  <text x="895" y="92" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">CLI</text>
  <text x="895" y="112" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">Rich terminal</text>

  <!-- Runtime -->
  <rect x="820" y="220" width="150" height="80" rx="14" fill="#475569" stroke="#334155" stroke-width="2" />
  <text x="895" y="252" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">Runtime</text>
  <text x="895" y="272" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">EventBus, SQLite</text>

  <!-- Arrows -->
  <line x1="190" y1="180" x2="230" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="380" y1="180" x2="420" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ASTParser -> TransformExtractor -->
  <path d="M570,165 C590,150 590,110 610,100" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- ASTParser -> CodeGraph -->
  <path d="M570,195 C590,210 590,250 610,260" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- TransformExtractor -> CLI -->
  <line x1="770" y1="100" x2="820" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- TransformExtractor -> Runtime (op.to_dict) -->
  <path d="M690,140 L690,220" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- CodeGraph -> CLI -->
  <path d="M770,255 C795,245 800,150 820,120" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- CodeGraph -> Runtime -->
  <line x1="770" y1="260" x2="820" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Edge labels -->
  <text x="210" y="172" text-anchor="middle" fill="#475569" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">path</text>
  <text x="400" y="172" text-anchor="middle" fill="#475569" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">text</text>

  <!-- Footer caption -->
  <text x="500" y="340" text-anchor="middle" fill="#334155" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">In-memory graph; rendered as Rich tables. No graph file is persisted today.</text>
</svg>
