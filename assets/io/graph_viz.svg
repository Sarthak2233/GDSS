<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="340">
  <defs>
    <marker id="arrowV" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="18">Ways to visualize the CodeGraph from the shell</text>

  <!-- Central source -->
  <rect x="400" y="70" width="200" height="70" rx="14" fill="#f59e0b" stroke="#92400e" stroke-width="2" />
  <text x="500" y="100" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">CodeGraph.g</text>
  <text x="500" y="120" text-anchor="middle" fill="#fff7ed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">NetworkX DiGraph (in memory)</text>

  <!-- Option A -->
  <rect x="40" y="220" width="200" height="90" rx="12" fill="#10b981" stroke="#065f46" stroke-width="2" />
  <text x="140" y="250" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">A. Summary</text>
  <text x="140" y="270" text-anchor="middle" fill="#d1fae5" font-family="Consolas, monospace" font-size="11">gdss analyze</text>
  <text x="140" y="290" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">node/edge counts</text>

  <!-- Option B -->
  <rect x="270" y="220" width="200" height="90" rx="12" fill="#2563eb" stroke="#1e40af" stroke-width="2" />
  <text x="370" y="250" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">B. Impact</text>
  <text x="370" y="270" text-anchor="middle" fill="#dbeafe" font-family="Consolas, monospace" font-size="11">impact &lt;symbol&gt;</text>
  <text x="370" y="290" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">downstream table</text>

  <!-- Option C -->
  <rect x="530" y="220" width="200" height="90" rx="12" fill="#7c3aed" stroke="#4c1d95" stroke-width="2" />
  <text x="630" y="250" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">C. Hierarchy</text>
  <text x="630" y="270" text-anchor="middle" fill="#ede9fe" font-family="Consolas, monospace" font-size="11">hierarchy</text>
  <text x="630" y="290" text-anchor="middle" fill="#ede9fe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Rich tree</text>

  <!-- Option D -->
  <rect x="760" y="220" width="200" height="90" rx="12" fill="#475569" stroke="#334155" stroke-width="2" />
  <text x="860" y="250" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">D. Export (manual)</text>
  <text x="860" y="270" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">nx.write_dot</text>
  <text x="860" y="290" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">to Graphviz PNG</text>

  <!-- Arrows -->
  <path d="M420,140 C300,160 180,180 140,220" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowV)" />
  <path d="M460,140 C420,165 400,185 380,220" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowV)" />
  <path d="M540,140 C580,165 605,185 625,220" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowV)" />
  <path d="M580,140 C700,160 820,180 860,220" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowV)" />
</svg>
