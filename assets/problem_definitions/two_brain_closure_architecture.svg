<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="100%" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#2563eb" />
    </marker>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-oracle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="18">Two-Brain Convergence Architecture</text>
  <text x="475" y="52" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Deterministic Core (0 Tokens, CPU) strictly isolated from Probabilistic Brain (BYOK / LLM)</text>

  <!-- Boundary 1: Deterministic Core -->
  <rect x="30" y="80" width="530" height="290" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6" />
  <text x="45" y="105" fill="#1e293b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">DETERMINISTIC CORE (0 Tokens, 100% Local CPU)</text>

  <!-- AST Parser -->
  <rect x="50" y="125" width="130" height="60" rx="8" fill="url(#grad-core)" stroke="#1e40af" stroke-width="1.5" />
  <text x="115" y="152" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">AST Parser</text>
  <text x="115" y="169" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Tree-sitter Engine</text>

  <!-- CodeGraph Engine -->
  <rect x="220" y="125" width="140" height="60" rx="8" fill="url(#grad-core)" stroke="#1e40af" stroke-width="1.5" />
  <text x="290" y="152" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">CodeGraph Engine</text>
  <text x="290" y="169" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Calls, Imports, Types</text>

  <!-- SIC Engine -->
  <rect x="400" y="125" width="140" height="60" rx="8" fill="url(#grad-core)" stroke="#1e40af" stroke-width="1.5" />
  <text x="470" y="150" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">SIC Engine (S*)</text>
  <text x="470" y="167" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">impact_closure.py</text>

  <!-- Arrows row 1 -->
  <line x1="180" y1="155" x2="220" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="360" y1="155" x2="400" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Worktree Sandbox -->
  <rect x="50" y="240" width="140" height="65" rx="8" fill="url(#grad-box)" stroke="#b45309" stroke-width="1.5" />
  <text x="120" y="267" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Ephemeral Sandbox</text>
  <text x="120" y="284" text-anchor="middle" fill="#fef3c7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Git Worktree Isolation</text>

  <!-- Validation Oracle -->
  <rect x="225" y="240" width="140" height="65" rx="8" fill="url(#grad-oracle)" stroke="#047857" stroke-width="1.5" />
  <text x="295" y="267" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Validation Oracle</text>
  <text x="295" y="284" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Syntax, Types, Tests</text>

  <!-- Diagnostic Extractor -->
  <rect x="400" y="240" width="140" height="65" rx="8" fill="url(#grad-core)" stroke="#1e40af" stroke-width="1.5" />
  <text x="470" y="267" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Diagnostic Extractor</text>
  <text x="470" y="284" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">E_k + Anti-Gaming</text>

  <!-- Arrows row 2 -->
  <line x1="190" y1="272" x2="225" y2="272" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="365" y1="272" x2="400" y2="272" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Boundary 2: Probabilistic Brain -->
  <rect x="650" y="80" width="270" height="290" rx="14" fill="#faf5ff" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6" />
  <text x="665" y="105" fill="#581c87" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">PROBABILISTIC BRAIN (BYOK / LLM)</text>

  <!-- AI Convergence Assistant -->
  <rect x="675" y="150" width="220" height="155" rx="12" fill="url(#grad-ai)" stroke="#5b21b6" stroke-width="2" />
  <text x="785" y="195" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">AI Convergence Assistant</text>
  <text x="785" y="220" text-anchor="middle" fill="#ede9fe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Iterative Multi-File Synthesis</text>
  <text x="785" y="240" text-anchor="middle" fill="#ddd6fe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Context Budgeting (50/30/20%)</text>
  <text x="785" y="260" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="10">Never Auto-Merges</text>

  <!-- Inter-Brain Connectors -->
  <!-- 1. SIC -> AI -->
  <path d="M 540 155 L 675 185" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="600" y="160" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="10">Structured S*</text>

  <!-- 2. AI -> Sandbox -->
  <path d="M 675 250 L 50 215 L 50 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="590" y="220" text-anchor="middle" fill="#6d28d9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="10">Multi-File Patch</text>

  <!-- 3. Diagnostic -> AI -->
  <path d="M 540 272 L 675 272" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <text x="605" y="265" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="10">Diagnostics E_k</text>
</svg>

