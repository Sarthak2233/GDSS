name: CI Test & Verification Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-gate:
    name: Backend Verification (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install GDSS and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,embeddings]

      - name: Configure Git for Smoke Tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Layer 1 - Static Lint (ruff)
        run: bash harness/sensors/lint.sh

      - name: Layer 1 - Static Typecheck (mypy)
        run: bash harness/sensors/typecheck.sh

      - name: Layer 1 - Architecture Fitness Sensor
        run: python3 harness/sensors/architecture_fitness.py

      - name: Layer 1 - DSA Optimization Fitness Sensor
        run: python3 harness/sensors/dsa_fitness.py

      - name: Layer 2 - Runtime Test Suite (pytest)
        run: bash harness/sensors/run_tests.sh

      - name: Layer 3 - CLI End-to-End Smoke Test
        run: bash harness/sensors/cli_smoke.sh

      - name: Layer 3 - REST API Smoke Test
        run: bash harness/sensors/api_smoke.sh

  frontend-gate:
    name: Frontend Verification (Node.js & pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11 (for token fitness sensor)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Layer F1 - ESLint & Accessibility
        working-directory: web
        run: pnpm lint

      - name: Layer F1 - TypeScript Validation
        working-directory: web
        run: pnpm typecheck

      - name: Layer F1 - Token & Motion Fitness
        run: python3 harness/sensors/frontend/token_fitness.py

      - name: Layer F2 - Vitest & Jest-Axe Component Tests
        working-directory: web
        run: pnpm test

      - name: Layer F3 - Next.js Production Build & Size Budget
        working-directory: web
        run: |
          pnpm build
          pnpm size

  ci-status:
    name: Full CI Verification Gate Status
    needs: [backend-gate, frontend-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.backend-gate.result }}" != "success" ] || [ "${{ needs.frontend-gate.result }}" != "success" ]; then
            echo "CI Verification Gate: FAILED. Check backend-gate or frontend-gate logs."
            exit 1
          fi
          echo "CI Verification Gate: ALL LAYERS GREEN. Verification passed."

