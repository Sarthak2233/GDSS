<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="320">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#dc2626" />
    </marker>
    <linearGradient id="grad-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="16">Pairwise Branch Interaction &amp; Collision Radar (Ω_ij)</text>

  <!-- Subgraph Branches -->
  <rect x="25" y="45" width="235" height="255" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="142" y="70" text-anchor="middle" fill="#334155" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">Concurrent Branches</text>

  <!-- Branch Nodes -->
  <rect x="42" y="90" width="200" height="46" rx="8" fill="url(#grad-br)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="142" y="112" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">Branch A: feature/oauth</text>
  <text x="142" y="126" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Modifies auth_token signature</text>

  <rect x="42" y="152" width="200" height="46" rx="8" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="142" y="174" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">Branch B: feature/timeout</text>
  <text x="142" y="188" text-anchor="middle" fill="#fce7f3" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Adds 30s timeout to auth_token</text>

  <rect x="42" y="214" width="200" height="46" rx="8" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  <text x="142" y="236" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">Branch C: feature/docs</text>
  <text x="142" y="250" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Updates documentation markdown</text>

  <!-- Outcome Nodes -->
  <rect x="580" y="90" width="250" height="46" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="705" y="112" text-anchor="middle" fill="#b91c1c" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">⚠️ Semantic Collision Predicted</text>
  <text x="705" y="126" text-anchor="middle" fill="#ef4444" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Non-commutative [TA, TB] ≠ 0</text>

  <rect x="580" y="152" width="250" height="46" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="705" y="174" text-anchor="middle" fill="#15803d" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">✅ Clean Commutative Merge</text>
  <text x="705" y="188" text-anchor="middle" fill="#22c55e" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Disjoint symbol scopes</text>

  <rect x="580" y="214" width="250" height="46" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="705" y="236" text-anchor="middle" fill="#15803d" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">✅ Independent / Zero Conflict</text>
  <text x="705" y="250" text-anchor="middle" fill="#22c55e" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Unrelated file paths</text>

  <!-- Connectors with Ω_ij values -->
  <!-- A + B -> Collision -->
  <path d="M242,113 C350,113 450,113 570,113" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="360" y="100" width="105" height="24" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="412" y="116" text-anchor="middle" fill="#b91c1c" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">Ω_AB = 0.89</text>

  <!-- B + C -> Clean -->
  <path d="M242,175 C350,175 450,175 570,175" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="360" y="162" width="105" height="24" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="412" y="178" text-anchor="middle" fill="#15803d" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">Ω_BC = 0.08</text>

  <!-- A + C -> Zero -->
  <path d="M242,237 C350,237 450,237 570,237" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="360" y="224" width="105" height="24" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="412" y="240" text-anchor="middle" fill="#15803d" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="11">Ω_AC = 0.00</text>

</svg>
