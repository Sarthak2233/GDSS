<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="100%" height="420">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="sandboxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="commentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1020" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    🛰️ GDSS GitHub Actions CI Pipeline: PR Collision Radar Flow
  </text>
  <text x="40" y="68" font-family="Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Continuous cross-branch semantic interaction detection, ephemeral sandbox validation, and sticky PR reports
  </text>

  <!-- Step 1: PR Trigger -->
  <g transform="translate(40, 110)">
    <rect width="145" height="180" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="145" height="34" rx="12" fill="url(#gitGrad)"/>
    <text x="72" y="22" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1. PR TRIGGER</text>
    <text x="14" y="60" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Events:</text>
    <text x="14" y="80" font-family="monospace" font-size="11" fill="#38bdf8">• opened</text>
    <text x="14" y="100" font-family="monospace" font-size="11" fill="#38bdf8">• synchronize</text>
    <text x="14" y="120" font-family="monospace" font-size="11" fill="#38bdf8">• reopened</text>
    <rect x="12" y="142" width="121" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="72" y="159" font-family="Segoe UI, Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">PR #42 (Incoming)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="185" y1="200" x2="225" y2="200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: GitHub Action Runner & Discovery -->
  <g transform="translate(230, 110)">
    <rect width="165" height="180" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="0" y="0" width="165" height="34" rx="12" fill="#0ea5e9"/>
    <text x="82" y="22" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. CI RUNNER &amp; API</text>
    <text x="14" y="60" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Runner Context:</text>
    <text x="14" y="80" font-family="monospace" font-size="10" fill="#7dd3fc">• GITHUB_TOKEN</text>
    <text x="14" y="100" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">REST Discovery:</text>
    <text x="14" y="120" font-family="monospace" font-size="10" fill="#94a3b8">GET /repos/…/pulls</text>
    <rect x="12" y="142" width="141" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="82" y="159" font-family="Segoe UI, Roboto, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Found N Open PRs</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="395" y1="200" x2="435" y2="200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Collision Radar Engine -->
  <g transform="translate(440, 110)">
    <rect width="175" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="175" height="34" rx="12" fill="url(#radarGrad)"/>
    <text x="87" y="22" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. RADAR TENSOR</text>
    <text x="14" y="60" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Deterministic Core:</text>
    <text x="14" y="80" font-family="monospace" font-size="10" fill="#fbbf24">• AST Operators</text>
    <text x="14" y="100" font-family="monospace" font-size="10" fill="#fbbf24">• Tensor Engine Ω_ij</text>
    <text x="14" y="120" font-family="monospace" font-size="10" fill="#fbbf24">• Call Graph Impact</text>
    <rect x="12" y="142" width="151" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="87" y="159" font-family="Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">Ω_42,41 = 0.85 (High)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="615" y1="200" x2="655" y2="200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Ephemeral Sandbox Validation -->
  <g transform="translate(660, 110)">
    <rect width="165" height="180" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="165" height="34" rx="12" fill="url(#sandboxGrad)"/>
    <text x="82" y="22" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. SANDBOX CHECK</text>
    <text x="14" y="60" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Ephemeral Worktree:</text>
    <text x="14" y="80" font-family="monospace" font-size="10" fill="#60a5fa">• Tree-sitter Syntax</text>
    <text x="14" y="100" font-family="monospace" font-size="10" fill="#60a5fa">• Targeted Types</text>
    <text x="14" y="120" font-family="monospace" font-size="10" fill="#60a5fa">• Unit Test Slice</text>
    <rect x="12" y="142" width="141" height="26" rx="6" fill="#0f172a" stroke="#16a34a"/>
    <text x="82" y="159" font-family="Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">Candidate Verified ✓</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="825" y1="200" x2="865" y2="200" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Step 5: Sticky Radar Comment & 1-Click Commit -->
  <g transform="translate(870, 110)">
    <rect width="115" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="115" height="34" rx="12" fill="url(#commentGrad)"/>
    <text x="57" y="22" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5. STICKY PR</text>
    <text x="10" y="60" font-family="Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">PR Interaction:</text>
    <text x="10" y="80" font-family="Segoe UI, Roboto, sans-serif" font-size="9" fill="#a7f3d0">• PATCH in-place</text>
    <text x="10" y="98" font-family="Segoe UI, Roboto, sans-serif" font-size="9" fill="#a7f3d0">• Zero Spam</text>
    <text x="10" y="116" font-family="Segoe UI, Roboto, sans-serif" font-size="9" fill="#a7f3d0">• Radar Table</text>
    <rect x="8" y="138" width="99" height="32" rx="6" fill="#065f46" stroke="#34d399"/>
    <text x="57" y="152" font-family="Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">1-Click Commit</text>
    <text x="57" y="164" font-family="Segoe UI, Roboto, sans-serif" font-size="8" fill="#d1fae5" text-anchor="middle">Suggestion</text>
  </g>

  <!-- Bottom Legend Banner -->
  <rect x="40" y="325" width="940" height="65" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="352" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Key Operating Guarantees:</text>
  <text x="60" y="372" font-family="Segoe UI, Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <tspan fill="#38bdf8" font-weight="600">Zero Token Fees to GDSS</tspan> (via native GITHUB_TOKEN &amp; GitHub Models) • <tspan fill="#fbbf24" font-weight="600">Never Auto-Merges</tspan> (humans decide what lands) • <tspan fill="#34d399" font-weight="600">Single Sticky Comment</tspan> (updates existing comment on re-push)
  </text>
</svg>
