<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#059669" />
    </marker>
    <linearGradient id="grad-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-ver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="16">The Three Levels of Correctness Hierarchy</text>
  <text x="450" y="46" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Progressive validation gates required to establish true repository semantic convergence</text>

  <!-- Level 1 -->
  <rect x="50" y="75" width="700" height="60" rx="10" fill="url(#grad-l1)" stroke="#1e40af" stroke-width="2" />
  <text x="75" y="100" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">Level 1: Conflict Correctness (Site-Local)</text>
  <text x="75" y="120" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Resolves AST collision at modified site. Verified by Tree-sitter AST Syntax Parser.</text>

  <!-- Arrow L1 -> L2 -->
  <line x1="400" y1="135" x2="400" y2="160" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="410" y="152" fill="#059669" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">Gate 1 Pass</text>

  <!-- Level 2 -->
  <rect x="50" y="160" width="700" height="60" rx="10" fill="url(#grad-l2)" stroke="#b45309" stroke-width="2" />
  <text x="75" y="185" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">Level 2: Dependency Consistency (Subsystem)</text>
  <text x="75" y="205" fill="#fef3c7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Harmonizes callers, imports, and contracts across closure. Verified by Static Typecheckers.</text>

  <!-- Arrow L2 -> L3 -->
  <line x1="400" y1="220" x2="400" y2="245" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="410" y="237" fill="#059669" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700">Gate 2 Pass</text>

  <!-- Level 3 -->
  <rect x="50" y="245" width="700" height="60" rx="10" fill="url(#grad-l3)" stroke="#5b21b6" stroke-width="2" />
  <text x="75" y="270" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">Level 3: Behavioral Consistency (Repository-Wide)</text>
  <text x="75" y="290" fill="#ede9fe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Satisfies test suites and runtime invariants. Verified by Ephemeral Worktree Test Runner.</text>

  <!-- Arrow L3 -> Verified -->
  <line x1="750" y1="275" x2="780" y2="275" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <!-- Verified Box -->
  <rect x="780" y="160" width="90" height="145" rx="10" fill="url(#grad-ver)" stroke="#047857" stroke-width="2" />
  <text x="825" y="215" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Verified</text>
  <text x="825" y="235" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Ready for</text>
  <text x="825" y="250" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Human PR</text>
  <text x="825" y="265" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9">Review</text>
</svg>

