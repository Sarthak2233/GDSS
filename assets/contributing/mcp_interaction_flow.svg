<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#94a3b8" />
    </marker>

    <linearGradient id="clientBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2a4d" />
      <stop offset="100%" stop-color="#071829" />
    </linearGradient>
    <linearGradient id="mcpBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="repoBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="280" rx="14" fill="#090d16" />

  <!-- 1. AI IDE Container (Left) -->
  <rect x="30" y="35" width="280" height="190" rx="14" fill="url(#clientBoxGrad)" stroke="#0284c7" stroke-width="2" />
  <rect x="45" y="48" width="170" height="24" rx="6" fill="#0369a1" />
  <text x="55" y="65" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Developer AI IDE</text>
  <text x="50" y="96" fill="#e0f2fe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="13">Cursor · Claude · Copilot</text>
  <text x="50" y="118" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5">User Subscription / Local Model</text>
  <text x="50" y="136" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">Zero GDSS Token Bleed ($0)</text>

  <rect x="48" y="152" width="244" height="58" rx="8" fill="#031f38" />
  <text x="58" y="172" fill="#7dd3fc" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Prompt: "Check collisions vs main"</text>
  <text x="58" y="192" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10.5">Executes tools &amp; crafts resolutions</text>

  <!-- 2. GDSS MCP Server (Center) -->
  <rect x="365" y="35" width="280" height="190" rx="14" fill="url(#mcpBoxGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="380" y="48" width="170" height="24" rx="6" fill="#047857" />
  <text x="390" y="65" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">GDSS MCP Server</text>
  <text x="385" y="96" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="13">stdio / JSON-RPC 2.0</text>
  <text x="385" y="118" fill="#a7f3d0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5">Command: `gdss mcp`</text>
  <text x="385" y="136" fill="#34d399" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="11">100% Deterministic Fact Provider</text>

  <rect x="382" y="152" width="246" height="58" rx="8" fill="#022c22" />
  <text x="392" y="172" fill="#6ee7b7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10.5">• gdss_detect_collisions (Ω_ij)</text>
  <text x="392" y="188" fill="#6ee7b7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10.5">• gdss_suggest_merge_order</text>
  <text x="392" y="202" fill="#6ee7b7" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10.5">• gdss_validate_patch (AST check)</text>

  <!-- 3. Local Repository & AST Core (Right) -->
  <rect x="695" y="35" width="275" height="190" rx="14" fill="url(#repoBoxGrad)" stroke="#64748b" stroke-width="2" />
  <rect x="710" y="48" width="160" height="24" rx="6" fill="#334155" />
  <text x="720" y="65" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">Deterministic Core</text>
  <text x="715" y="96" fill="#f1f5f9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="13">Local Git &amp; AST Engine</text>
  <text x="715" y="118" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5">Local Workspace (.git)</text>
  <text x="715" y="136" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Tree-sitter · CodeGraph</text>

  <rect x="712" y="152" width="242" height="58" rx="8" fill="#0b1329" />
  <text x="722" y="172" fill="#93c5fd" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10.5">Parse modified AST trees</text>
  <text x="722" y="188" fill="#93c5fd" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10.5">Detect non-commuting operators</text>
  <text x="722" y="202" fill="#93c5fd" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10.5">Sandboxed unified diff validation</text>

  <!-- Arrows between IDE and MCP -->
  <line x1="310" y1="105" x2="365" y2="105" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="337" y="96" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9.5" font-weight="600">Call</text>

  <line x1="365" y1="140" x2="310" y2="140" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="337" y="154" text-anchor="middle" fill="#10b981" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9.5" font-weight="600">AST Facts</text>

  <!-- Arrows between MCP and Deterministic Core -->
  <line x1="645" y1="105" x2="695" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)" />
  <text x="670" y="96" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9.5">Query</text>

  <line x1="695" y1="140" x2="645" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)" />
  <text x="670" y="154" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9.5">Result</text>

  <!-- Caption Footer -->
  <text x="500" y="255" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5">Model Context Protocol Architecture: Developer IDE AI uses local GDSS MCP server for ground-truth AST collision radar</text>
</svg>
