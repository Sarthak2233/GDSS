<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#cbd5e1" />
    </marker>
  </defs>

  <!-- Input -->
  <rect x="40" y="50" width="200" height="160" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="140" y="85" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">Input</text>
  <text x="140" y="120" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Git Repository</text>
  <text x="140" y="145" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Source Files</text>

  <!-- Live today -->
  <rect x="280" y="40" width="280" height="180" rx="12" fill="#1e40af" stroke="#3b82f6" stroke-width="2" />
  <text x="420" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">Live today</text>
  <text x="420" y="100" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">AST Parser</text>
  <text x="420" y="120" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Transform Operators</text>
  <text x="420" y="140" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Dependency Graph</text>
  <text x="420" y="160" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Embeddings + FAISS</text>
  <text x="420" y="190" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">status · diff · log · similar</text>

  <!-- Planned -->
  <rect x="600" y="50" width="360" height="160" rx="12" fill="#475569" stroke="#334155" stroke-width="2" />
  <text x="780" y="85" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="14">Planned</text>
  <text x="780" y="120" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Drift Monitor (Phase 3)</text>
  <text x="780" y="145" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Conflict Tensor (Phase 4)</text>
  <text x="780" y="170" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">AI Suggestions (Phase 5)</text>

  <line x1="240" y1="130" x2="280" y2="130" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="560" y1="130" x2="600" y2="130" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)" />

  <text x="500" y="255" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">Architecture — live Phase 0–2 vs planned Phase 3+</text>
</svg>
