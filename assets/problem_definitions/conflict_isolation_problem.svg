<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#059669" />
    </marker>
    <linearGradient id="grad-conflict" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="grad-impact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-test" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="18">The Conflict Blast Radius: Direct Collision vs. Transitive Reality</text>
  <text x="475" y="52" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">A conflict does not exist in isolation; AST mutations ripple through callers and test suites</text>

  <!-- Subgraph 1: Direct Conflict Boundary -->
  <rect x="30" y="80" width="380" height="150" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6,6" />
  <text x="45" y="105" fill="#991b1b" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">DIRECT CONFLICT BOUNDARY (Site-Local C₀)</text>

  <!-- Node A: payment_service.py -->
  <rect x="50" y="125" width="160" height="85" rx="10" fill="url(#grad-conflict)" stroke="#b91c1c" stroke-width="2" />
  <text x="130" y="152" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">payment_service.py</text>
  <text x="130" y="172" text-anchor="middle" fill="#fee2e2" font-family="Consolas, monospace" font-size="11">process_payment()</text>
  <text x="130" y="192" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Direct Conflicted Mutation</text>

  <!-- Node B: checkout.py -->
  <rect x="230" y="125" width="160" height="85" rx="10" fill="url(#grad-conflict)" stroke="#b91c1c" stroke-width="2" />
  <text x="310" y="152" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">checkout.py</text>
  <text x="310" y="172" text-anchor="middle" fill="#fee2e2" font-family="Consolas, monospace" font-size="11">checkout_flow()</text>
  <text x="310" y="192" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Direct Caller Mutation</text>

  <!-- Connector A <-> B -->
  <line x1="210" y1="167" x2="230" y2="167" stroke="#dc2626" stroke-width="2" />

  <!-- Subgraph 2: Transitive Semantic Impact -->
  <rect x="440" y="80" width="480" height="150" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2" stroke-dasharray="6,6" />
  <text x="455" y="105" fill="#92400e" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">TRANSITIVE SEMANTIC IMPACT (D(C₀) ∪ K(C₀))</text>

  <!-- Node C: order_service.py -->
  <rect x="465" y="125" width="200" height="85" rx="10" fill="url(#grad-impact)" stroke="#b45309" stroke-width="2" />
  <text x="565" y="152" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">order_service.py</text>
  <text x="565" y="172" text-anchor="middle" fill="#fef3c7" font-family="Consolas, monospace" font-size="11">place_order()</text>
  <text x="565" y="192" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Indirect 2-Hop Caller</text>

  <!-- Node D: api/routes.py -->
  <rect x="700" y="125" width="200" height="85" rx="10" fill="url(#grad-impact)" stroke="#b45309" stroke-width="2" />
  <text x="800" y="152" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">api/routes.py</text>
  <text x="800" y="172" text-anchor="middle" fill="#fef3c7" font-family="Consolas, monospace" font-size="11">POST /v1/checkout</text>
  <text x="800" y="192" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10">Public API Route Contract</text>

  <!-- Connector B -> C -->
  <line x1="390" y1="167" x2="465" y2="167" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Connector C -> D -->
  <line x1="665" y1="167" x2="700" y2="167" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Subgraph 3: Behavioral Validation Oracle -->
  <rect x="180" y="270" width="590" height="120" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="6,6" />
  <text x="195" y="295" fill="#065f46" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="12">BEHAVIORAL VALIDATION ORACLE (T(C₀))</text>

  <!-- Node E: test_payment.py -->
  <rect x="230" y="310" width="490" height="65" rx="10" fill="url(#grad-test)" stroke="#047857" stroke-width="2" />
  <text x="475" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="13">tests/test_payment.py</text>
  <text x="475" y="357" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Unit, Integration &amp; Contract Verification Suites</text>

  <!-- Connectors to Tests -->
  <path d="M 130 210 L 130 342 L 230 342" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)" />
  <path d="M 565 210 L 565 310" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)" />

  <!-- Flow Legend Labels -->
  <text x="18" y="270" fill="#059669" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-style="italic">Target of Assertions</text>
  <text x="575" y="260" fill="#059669" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-style="italic">Tested by Flow Invariants</text>
</svg>

